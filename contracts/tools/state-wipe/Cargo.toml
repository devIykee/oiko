[package]
name = "oiko-state-wipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Testnet maintenance tool: deletes storage keys so a contract can be redeployed with a new layout. Not part of the product."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
